[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-thought"
version = "0.1.0"
description = "Learning infrastructure for typed probabilistic decisions from System One models (Laya, and typed-decision providers you bring yourself)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Karthik Nambiar" }]
keywords = [
    "typed-decisions",
    "active-learning",
    "calibration",
    "system-one",
    "laya",
    "fine-tuning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
secondthought = "second_thought.cli.main:app"

[project.urls]
Repository = "https://github.com/KNambiarDJsc/second-thought"

[tool.hatch.build.targets.wheel]
packages = ["src/second_thought"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["laya", "pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
