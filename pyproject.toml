[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-thought"
version = "0.1.0"
description = "Learning infrastructure for typed probabilistic decisions from any System One model: capture, calibration, uncertainty-based review, drift monitoring, and fine-tune-ready dataset export."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Karthik Nambiar" }]
keywords = [
    "typed-decisions",
    "active-learning",
    "calibration",
    "system-one",
    "laya",
    "fine-tuning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.5"]
# second_thought.experiments (used by examples/toy_typed_decisions and
# examples/generic_provider) needs these to actually *run* an experiment;
# importing the module itself does not (see the TYPE_CHECKING guard in
# experiments/runner.py) — declared here so `pip install second-thought`
# alone never fails an import, and `pip install second-thought[experiments]`
# is what running the examples/CI actually requires.
experiments = ["numpy>=1.24", "scikit-learn>=1.3"]
# The local review + calibration-drift dashboard (`secondthought serve`).
# Everything it calls (Store, select, correct, evaluate, drift) is already a
# core dependency-free part of the SDK; this extra is only the thin HTTP
# layer on top, kept optional so the core install stays as light as it is.
dashboard = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
secondthought = "second_thought.cli.main:app"

[project.urls]
Repository = "https://github.com/KNambiarDJsc/second-thought"

[tool.hatch.build.targets.wheel]
packages = ["src/second_thought"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["laya", "pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
